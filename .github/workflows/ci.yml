name: Redteam Security Checks

on:
  pull_request:
    paths:
      - 'apps/proxy-engine/**'
      - 'apps/healing-worker/**'
      - 'libs/**'

jobs:
  security-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync dependencies
        run: uv sync

      - name: Boot local stack
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Wait for proxy-engine
        run: |
          until curl -s http://localhost:8000/health; do
            echo "Waiting for proxy-engine..."
            sleep 2
          done

      - name: Run Redteam Suite
        run: python scripts/run-redteam-suite.py
