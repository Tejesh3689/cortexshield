[project]
name = "realtime-gateway"
version = "0.1.0"
description = "CortexShield Realtime WebSocket Gateway"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "python-dotenv>=1.0.0",
    "asyncpg>=0.28.0",
    "PyJWT>=2.8.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
