[project]
name = "billing_service"
version = "0.1.0"
description = "Billing & Stripe Integration Service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "stripe>=6.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
    "redis>=5.0.0",
    "python-dotenv>=1.0.0",
    "cortex_db",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
cortex_db = { workspace = true }
