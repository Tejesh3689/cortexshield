[project]
name = "proxy-engine"
version = "0.1.0"
description = "CortexShield Proxy Engine"
requires-python = ">=3.12"
dependencies = [
    "cortex_healing",
    "cortex_schemas",
    "cortex_security_rules",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.25.0",
    "redis>=8.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
cortex_healing = { workspace = true }
cortex_schemas = { workspace = true }
cortex_security_rules = { workspace = true }
