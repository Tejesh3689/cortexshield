[project]
name = "proxy-engine"
version = "0.1.0"
description = "CortexShield Proxy Engine"
requires-python = ">=3.10"
dependencies = [
    "cortex_healing",
    "cortex_schemas",
    "cortex_security_rules",
    "cortex_db",
    "asyncpg>=0.28.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.25.0",
    "redis>=8.0.1",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "websockets>=12.0",
    "neo4j>=5.0.0",
    "reportlab>=4.0.0",
    "apscheduler",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
cortex_healing = { workspace = true }
cortex_schemas = { workspace = true }
cortex_security_rules = { workspace = true }
cortex_db = { workspace = true }
