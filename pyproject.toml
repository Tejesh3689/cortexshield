[project]
name = "cortexshield"
version = "0.1.0"
description = "CortexShield Monorepo"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "neo4j>=6.2.0",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "asyncpg>=0.28.0",
    "sqlalchemy>=2.0.0"
]

[tool.uv.workspace]
members = [
    "apps/proxy-engine",
    "apps/healing-worker",
    "apps/anomaly-service",
    "apps/policy-service",
    "apps/billing-service",
    "apps/realtime-gateway",
    "libs/*"
]

[tool.uv.sources]
cortex_db = { workspace = true }
cortex_auth = { workspace = true }
cortex_schemas = { workspace = true }
cortex_neo4j_client = { workspace = true }
cortex_security_rules = { workspace = true }
cortex_telemetry = { workspace = true }
cortex_healing = { workspace = true }
