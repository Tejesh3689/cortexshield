[project]
name = "cortex_db"
version = "0.1.0"
description = "CortexShield Database Models and Migrations"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cortex_db*"]
